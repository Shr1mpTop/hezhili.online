name: Build frontend (PR gate) + deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Build
      run: |
        cd frontend
        # Pages 站在项目子路径 https://shr1mptop.github.io/hezhili.online/ 下，
        # 必须 --base 否则 /assets/* 404；PM2 生产构建不受影响（仍用默认 base=/）
        npm run build -- --base=/hezhili.online/
        
    - name: Setup Pages
      if: github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: frontend/dist
        
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      id: deployment
      uses: actions/deploy-pages@v4

# NOTE (2026-11-13): this file used to point at `vue-app/`, which no longer exists - the
# frontend lives in `frontend/`, so the whole workflow failed on every push/PR. Paths fixed.
# Production deployment of hezhili.online is done with PM2 (see deploy_pm2.sh +
# ecosystem.config.cjs on the host); the Pages steps here only matter if Pages is enabled
# for this repo.
# 2026-11-18: Pages build_type 已通过 API 切为 "workflow"（原 legacy 分支部署与 deploy-pages
# 互斥，导致本 workflow 的 Deploy 步骤必挂、而动态 pages build 却绿——双跑误导）。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false