name: Build frontend (PR gate) + deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Build
      run: |
        cd frontend
        npm run build
        
    - name: Setup Pages
      if: github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: frontend/dist
        
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      id: deployment
      uses: actions/deploy-pages@v4

# NOTE (2026-11-13): this file used to point at `vue-app/`, which no longer exists - the
# frontend lives in `frontend/`, so the whole workflow failed on every push/PR. Paths fixed.
# Production deployment of hezhili.online is done with PM2 (see deploy_pm2.sh +
# ecosystem.config.cjs on the host); the Pages steps here only matter if Pages is enabled
# for this repo.
# 需要在仓库设置中启用 GitHub Pages 并设置为使用 GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false